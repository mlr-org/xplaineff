# Manually triggered: runs the article's bike-sharing examples with the CRAN release of
# xplaineff on four platforms and prints the split tables, to document how the random
# forest, and with it int_imp, varies across CPU architectures.
on:
  workflow_dispatch:

name: platform-check

permissions: read-all

jobs:
  platform-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::xplaineff
            cran::mlr3
            cran::mlr3learners
            cran::ranger
            cran::ISLR2

      - name: Run the examples
        shell: bash
        run: Rscript .github/platform-check/examples.R 2>&1 | tee "platform-check-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: platform-check-${{ matrix.os }}
          path: platform-check-${{ matrix.os }}.txt
